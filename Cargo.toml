[package]
name = "rdoo"
version = "0.7.1"
edition = "2024"

[dependencies]
muda = "0.21.2"
notify = "8.2.0"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
toml = "1.1.8"
tray-icon = "0.26.1"
wry = "0.57.1"

[workspace]
exclude = ["vendor"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
